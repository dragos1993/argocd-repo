apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: penpot-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/dragos1993/release-penpot.git
      targetRevision: main
      path: .
      helm:
        # Must match the release name used for the direct `helm install`
        # (see release-penpot/README.md). ArgoCD defaults the Helm release
        # name to the Application's own name ("penpot-app"), which would
        # change the rendered app.kubernetes.io/instance selector label on
        # every Deployment -- and Deployment selectors are immutable, so
        # ArgoCD would fail to sync against resources created by the CLI
        # install with a different release name.
        releaseName: penpot
        valueFiles:
          - $values/values-dev.yaml
    - repoURL: https://github.com/dragos1993/envirenment-penpot.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: penpot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
