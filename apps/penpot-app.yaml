apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: penpot-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/dragos1993/release-penpot.git
      targetRevision: main
      path: .
      helm:
        valueFiles:
          - $values/values-dev.yaml
    - repoURL: https://github.com/dragos1993/envirenment-penpot.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: penpot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
